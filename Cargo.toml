[package]
name = "tulipa-app-scraper"
version = "0.2.0"
edition = "2021"
authors = ["Jan Alexandr Kopřiva"]
license = "AGPL-3.0-or-later"
description = "Exports product and stock data from the Tulipa B2B florist portal."
repository = "https://github.com/koprjaa/tulipa-app-scraper"

[[bin]]
name = "tulipa-scraper"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
csv = "1"
flate2 = "1"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "cookies", "gzip", "deflate", "brotli"] }
serde_json = { version = "1", features = ["preserve_order"] }
ctrlc = "3"
unicode-casefold = "0.2"

[dev-dependencies]
tempfile = "3"
httpmock = "0.8"
